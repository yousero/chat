<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный чат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Анонимный чат</h1>
            <div class="user-info">
                <span>Вы: </span>
                <span id="username"></span>
                <button id="changeNicknameBtn" class="change-nickname-btn" title="Изменить никнейм">✏️</button>
            </div>
        </div>

        <!-- Модальное окно для изменения никнейма -->
        <div id="nicknameModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Изменить никнейм</h2>
                    <button class="modal-close" id="closeModalBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="newNicknameInput" placeholder="Введите новый никнейм (32 символа)" maxlength="32" autocomplete="off">
                    <div class="modal-buttons">
                        <button id="generateNicknameBtn" class="btn-secondary">Сгенерировать случайный</button>
                        <button id="saveNicknameBtn" class="btn-primary">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chat-container">
            <div id="messages" class="messages"></div>
        </div>
        
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
            <button id="sendButton">Отправить</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, query, orderByKey, limitToLast, startAfter } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        // Экспортируем Firebase функции для использования в app.js
        window.firebaseApp = { initializeApp, getDatabase, ref, push, onChildAdded, query, orderByKey, limitToLast, startAfter };
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
